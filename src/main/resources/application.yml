spring:
  application:
    name: projectMohammadi

  datasource:
    url: jdbc:postgresql://localhost:5432/m_project
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5  # کاهش مقدار در صورت نیاز
      minimum-idle: 2  # کاهش برای بهینه‌سازی منابع
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # بعد از ساخت جداول مقدار را به "none" تغییر بده
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
